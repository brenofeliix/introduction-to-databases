name: Validate Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-pr:
    name: validate-pr
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ github.head_ref }}"
          echo "Branch recebida: $BRANCH"

          if [[ ! "$BRANCH" =~ ^team-([0-9]{2})$ ]]; then
            echo "::error::Nome de branch inválido."
            echo "::error::Use o padrão team-XX. Ex.: team-01, team-08, team-15."
            exit 1
          fi

          TEAM_NUMBER="${BASH_REMATCH[1]}"
          echo "team_number=$TEAM_NUMBER" >> "$GITHUB_OUTPUT"
          echo "team_name=team-$TEAM_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Validate Pull Request title
        id: pr
        shell: bash
        run: |
          set -euo pipefail

          TITLE="${{ github.event.pull_request.title }}"
          BRANCH_TEAM="${{ steps.branch.outputs.team_number }}"

          echo "Título recebido: $TITLE"

          if [[ ! "$TITLE" =~ ^\[N([123])\]\[(UNEMAT|UFR)\]\[Team[[:space:]]([0-9]{2})\][[:space:]]Sprints[[:space:]]1-5[[:space:]]-[[:space:]].+$ ]]; then
            echo "::error::Título do Pull Request inválido."
            echo "::error::Use: [N1][UNEMAT][Team XX] Sprints 1-5 - Nome do Banco"
            echo "::error::Também são aceitos N2/N3 e UFR."
            exit 1
          fi

          MODULE="${BASH_REMATCH[1]}"
          INSTITUTION="${BASH_REMATCH[2]}"
          TITLE_TEAM="${BASH_REMATCH[3]}"

          if [[ "$TITLE_TEAM" != "$BRANCH_TEAM" ]]; then
            echo "::error::O Team informado no título não corresponde à branch."
            echo "::error::Branch: team-$BRANCH_TEAM | Título: Team $TITLE_TEAM"
            exit 1
          fi

          echo "module_number=$MODULE" >> "$GITHUB_OUTPUT"
          echo "institution=$INSTITUTION" >> "$GITHUB_OUTPUT"

      - name: Define submission directory
        id: context
        shell: bash
        run: |
          set -euo pipefail

          TEAM="${{ steps.branch.outputs.team_name }}"
          INSTITUTION="${{ steps.pr.outputs.institution }}"
          MODULE="${{ steps.pr.outputs.module_number }}"

          TEAM_DIR="teams/Teams-${INSTITUTION}/${TEAM}"
          MODULE_DIR="${TEAM_DIR}/Module-${MODULE}"

          echo "team_dir=$TEAM_DIR" >> "$GITHUB_OUTPUT"
          echo "module_dir=$MODULE_DIR" >> "$GITHUB_OUTPUT"
          echo "Diretório esperado: $MODULE_DIR"

      - name: Validate changed files
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          MODULE_DIR="${{ steps.context.outputs.module_dir }}"

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          echo "Arquivos modificados:"
          echo "$CHANGED_FILES"

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "::error::Nenhum arquivo foi modificado."
            exit 1
          fi

          INVALID=0

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            if [[ "$file" != "$MODULE_DIR/"* ]]; then
              echo "::error file=$file::Arquivo fora do diretório permitido."
              echo "::error::O aluno só pode alterar arquivos em: $MODULE_DIR/"
              INVALID=1
            fi
          done <<< "$CHANGED_FILES"

          if [[ "$INVALID" -eq 1 ]]; then
            exit 1
          fi

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail

          MODULE="${{ steps.pr.outputs.module_number }}"
          DIR="${{ steps.context.outputs.module_dir }}"
          MISSING=0

          if [[ "$MODULE" == "1" ]]; then
            REQUIRED=(
              "SPRINT1-5.md"
              "SPRINT2-5.md"
              "SPRINT2-5.sql"
              "SPRINT3-5.md"
              "SPRINT3-5.sql"
              "SPRINT4-5.md"
              "SPRINT4-5.sql"
              "SPRINT5-5.md"
              "SPRINT5-5.sql"
            )
          else
            REQUIRED=(
              "SPRINT1-5.md"
              "SPRINT1-5.sql"
              "SPRINT2-5.md"
              "SPRINT2-5.sql"
              "SPRINT3-5.md"
              "SPRINT3-5.sql"
              "SPRINT4-5.md"
              "SPRINT4-5.sql"
              "SPRINT5-5.md"
              "SPRINT5-5.sql"
            )
          fi

          for filename in "${REQUIRED[@]}"; do
            FILE="$DIR/$filename"

            if [[ ! -f "$FILE" ]]; then
              echo "::error file=$FILE::Arquivo obrigatório ausente: $filename"
              MISSING=1
            else
              echo "OK: $filename"
            fi
          done

          if [[ "$MISSING" -eq 1 ]]; then
            echo "::error::A entrega do Module-$MODULE está incompleta."
            exit 1
          fi

      - name: Validate non-empty files
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ steps.context.outputs.module_dir }}"

          for file in "$DIR"/*.md "$DIR"/*.sql; do
            [[ -e "$file" ]] || continue

            if [[ ! -s "$file" ]]; then
              echo "::error file=$file::O arquivo está vazio."
              exit 1
            fi
          done

      - name: Validate basic SQL content
        shell: bash
        run: |
          set -euo pipefail

          DIR="${{ steps.context.outputs.module_dir }}"

          for file in "$DIR"/*.sql; do
            [[ -e "$file" ]] || continue

            if ! grep -Eqi '\b(SELECT|CREATE|INSERT|UPDATE|DELETE|ALTER|DROP|CALL|START|COMMIT|ROLLBACK)\b' "$file"; then
              echo "::error file=$file::O arquivo .sql não contém comandos SQL reconhecíveis."
              exit 1
            fi
          done

      - name: Validate commits
        shell: bash
        run: |
          set -euo pipefail

          COMMITS="${{ github.event.pull_request.commits }}"
          echo "Quantidade de commits no PR: $COMMITS"

          if [[ "$COMMITS" -lt 5 ]]; then
            echo "::error::O Pull Request deve possuir pelo menos 5 commits."
            echo "::error::Recomendação: pelo menos um commit por Sprint."
            exit 1
          fi

      - name: Validation completed
        run: |
          echo "=============================================="
          echo "PULL REQUEST VALIDADO COM SUCESSO"
          echo "Module: Module-${{ steps.pr.outputs.module_number }}"
          echo "Instituição: ${{ steps.pr.outputs.institution }}"
          echo "Branch: ${{ steps.branch.outputs.team_name }}"
          echo "Destino: main"
          echo "=============================================="
